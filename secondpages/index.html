<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>약관 및 정책 · SecondPages</title>
<style>
:root{--bg:#fff;--fg:#1b1b1f;--sub:#5d5d66;--line:#e4e4ea;--soft:#f5f5f8;--link:#4545d2}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--fg:#ededf0;--sub:#a0a0ab;--line:#2c2c33;--soft:#1b1b20;--link:#9d9dff}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:720px;margin:0 auto;padding:32px 20px 80px}
nav{max-width:720px;margin:0 auto;padding:20px 20px 0;font-size:14px;color:var(--sub);display:flex;gap:16px;flex-wrap:wrap}
nav a{color:var(--sub);text-decoration:none}
nav a[aria-current=page]{color:var(--fg);font-weight:600}
h1{font-size:26px;line-height:1.35;margin:16px 0 24px}
h2{font-size:19px;line-height:1.45;margin:44px 0 12px;padding-top:20px;border-top:1px solid var(--line)}
h3{font-size:16px;margin:28px 0 8px}
p,li{color:var(--fg)}
ol,ul{padding-left:22px}
li{margin:4px 0}
a{color:var(--link)}
strong{font-weight:600}
.tbl{overflow-x:auto;margin:12px 0 20px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--soft);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{min-width:104px}
.draft{background:#fff3cd;color:#664d03;padding:10px 20px;font-size:14px;text-align:center}
footer{max-width:720px;margin:0 auto;padding:0 20px 40px;color:var(--sub);font-size:13px}
.home a{display:block;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg);font-weight:600}
</style>
</head>
<body>

<nav><a href="./terms/">이용약관</a><a href="./privacy/">개인정보처리방침</a></nav>
<main><h1>약관 및 정책</h1><div class="home"><a href="./privacy/">개인정보처리방침</a><a href="./terms/">이용약관</a></div></main>
<footer>주식회사 더레이어스스튜디오</footer>
</body>
</html>
